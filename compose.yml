name: validacion-documental

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # CPU por defecto: compatible como primera prueba en Windows/AMD.
    # La GPU Radeon se estudiara por separado.

  
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen3-vl:4b-instruct"
    depends_on:
      ollama:
        condition: service_started


  n8n-import:
    profiles: ["setup"]
    image: n8nio/n8n:2.44.4
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      if [ -z "$$(n8n list:workflow --onlyId)" ]; then
        n8n import:workflow --input=/import/api-validacion-documental.json;
      else
        echo 'Workflows exist, skipping import';
      fi
    environment: &n8n_env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - ./workflow:/import:ro
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.44.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-15678}:5678"
    environment:
      <<: *n8n_env
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  task-runners:
    build:
      context: ./docker/sharp-runner
      dockerfile: Dockerfile
    image: validacion-documental/runners-sharp:2.44.4
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    depends_on:
      n8n:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: validacion-documental/frontend:1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18080}:80"
    depends_on:
      n8n:
        condition: service_started

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
