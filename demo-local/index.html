<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba API n8n</title>
    <style>
        body {
      font-family: Arial, sans-serif;
      max-width: 550px;
      margin: 60px auto;
      padding: 20px;
    }
    button { padding: 10px 20px; margin-top: 15px; }
    pre { background: #eee; padding: 15px; white-space: pre-wrap; }
    
    </style>
</head>
<body>

    <h1>Validador de documentos</h1>
  <p>Prueba local de Gemma 3 + Sharp</p>

  <input type="file" id="imagen" accept="image/jpeg,image/png">
  <button id="validar">Validar imagen</button>

  <h2>Resultado</h2>
  <pre id="resultado">Esperando fotografía...</pre>

  <script>
    document.getElementById("validar").addEventListener("click", async () => {
      const archivo = document.getElementById("imagen").files[0];
      const resultado = document.getElementById("resultado");
      const boton = document.getElementById("validar");

      if (!archivo) {
        resultado.textContent = "Selecciona una imagen primero.";
        return;
      }

      const datos = new FormData();
      datos.append("Imagen", archivo);

      boton.disabled = true;
      resultado.textContent = "Analizando imagen...";

      try {
        const respuesta = await fetch(
          "http://localhost:5678/webhook/validar-documento",
          { method: "POST", body: datos }
        );

        if (!respuesta.ok) {
          throw new Error("Error HTTP " + respuesta.status);
        }

        const json = await respuesta.json();
        resultado.textContent = JSON.stringify(json, null, 2);

      } catch (error) {
        resultado.textContent = "Error: " + error.message;
      } finally {
        boton.disabled = false;
      }
    });
  </script>
    
</body>
</html>
